# ---------------------------------------------------------------- #
# AI 기본 설정
# ---------------------------------------------------------------- #

language: ko-KR

tone_instructions: >
  당신은 프론트엔드 팀 프로젝트의 코드 리뷰어입니다.
  목표는 코드의 안정성, 가독성, 유지보수성을 높이고 팀의 일관된 개발 방식을 유지하도록 돕는 것입니다.
  버그 가능성, 잘못된 로직, 타입 안정성, 예외 처리 등 실제 동작에 영향을 줄 수 있는 문제를 우선적으로 검토하세요.
  문제를 지적할 때는 원인, 발생할 수 있는 영향, 개선 방향을 구체적으로 설명하세요.
  단순한 취향이나 과도한 리팩토링 제안은 지양하고, 실질적인 개선이 필요한 경우에만 제안하세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  # 리뷰의 전반적인 스타일을 설정합니다. 'chill'은 비교적 덜 엄격하고 부드러운 톤을 의미합니다.
  profile: chill

  # CodeRabbit의 코멘트를 모두 `resolve`하면, 자동으로 Approve를 하는 기능입니다.
  # PR은 리뷰어 Approve 후 머지한다는 팀 컨벤션에 따라 비활성화합니다.
  request_changes_workflow: false

  # PR의 전체적인 변경 사항에 대한 고수준의 요약(summary)을 생성할지 여부입니다.
  high_level_summary: true

  # 변경된 각 파일에 대한 요약을 생성하여 파일별 변경 내용을 빠르게 파악할 수 있도록 합니다.
  changed_files_summary: true

  # 코드의 실행 흐름을 보여주는 시퀀스 다이어그램을 생성할지 여부입니다.
  # PR이 너무 길어지는 것을 방지하기 위해 비활성화했습니다.
  sequence_diagrams: false

  # PR에 연결된 이슈(Issue)를 분석하여 리뷰 컨텍스트에 활용할지 여부입니다.
  assess_linked_issues: true

  # 연관된 다른 이슈를 찾아서 링크할지 여부입니다.
  related_issues: false

  # 연관된 다른 PR을 찾아서 링크할지 여부입니다.
  related_prs: false

  # PR에 적절한 레이블(e.g., 'bug', 'enhancement')을 제안할지 여부입니다.
  suggested_labels: false

  # 제안된 레이블을 자동으로 PR에 적용할지 여부입니다.
  auto_apply_labels: false

  # 이 PR을 리뷰할 만한 적절한 동료 리뷰어를 추천할지 여부입니다.
  suggested_reviewers: false

  # 추천된 리뷰어를 자동으로 할당할지 여부입니다.
  auto_assign_reviewers: false

  # 리뷰 요약에 위트 있는 시(poem)를 포함할지 여부입니다.
  poem: true

  # 특정 파일 경로에 따라 다른 리뷰 지침을 적용합니다.
  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        1. 버그 가능성, 잘못된 로직, 타입 안정성, null/undefined 처리, 예외 처리를 우선적으로 확인해주세요.
        2. 불필요한 상태 저장이나 useEffect를 이용한 상태 동기화가 없는지 확인해주세요.
        3. 기존 프로젝트 구조, 네이밍, 구현 패턴과의 일관성을 확인해주세요.
        4. 단순 취향에 따른 변경이나 실질적인 이점이 없는 리팩토링은 제안하지 마세요.
        5. 문제를 지적할 때는 원인, 발생 가능한 영향, 개선 방향을 함께 설명해주세요.
        6. 공식 문서가 문제 이해에 실질적으로 도움이 되는 경우 React, Next.js, TypeScript 등의 공식 문서를 우선 참고해주세요.

    - path: 'src/components/common/**/*.{ts,tsx}'
      instructions: |
        1. 여러 화면에서 재사용되는 공통 컴포넌트라는 점을 고려해 API의 범용성과 일관성을 검토해주세요.
        2. 특정 페이지의 요구사항이 공통 컴포넌트에 과도하게 결합되지 않았는지 확인해주세요.
        3. props와 타입이 컴포넌트의 역할을 명확하게 표현하는지 확인해주세요.
        4. 기존 props나 동작 변경으로 다른 사용처에 영향을 줄 가능성이 있는지 확인해주세요.
        5. 기존 공통 컴포넌트로 처리 가능한 기능을 중복 구현하고 있지 않은지 확인해주세요.
        6. 접근성과 기본 HTML 동작을 불필요하게 훼손하고 있지 않은지 확인해주세요.

    - path: 'src/app/**/*.{ts,tsx}'
      instructions: |
        1. Next.js App Router의 구조와 역할에 맞게 구현되었는지 확인해주세요.
        2. Client Component가 필요한 범위보다 넓게 사용되고 있지 않은지 확인해주세요.
        3. 페이지 컴포넌트가 지나치게 많은 UI와 비즈니스 로직을 직접 담당하고 있지 않은지 검토해주세요.
        4. Link, Router, searchParams 등 Next.js에서 제공하는 기능을 적절하게 사용하고 있는지 확인해주세요.
        5. 라우트별 로직이나 컴포넌트가 불필요하게 다른 도메인과 강하게 결합되지 않았는지 확인해주세요.

    - path: 'src/api/**/*.{ts,tsx}'
      instructions: |
        1. API 요청 및 응답 타입이 명확하게 정의되어 있는지 확인해주세요.
        2. HTTP 오류 및 예상하지 못한 응답에 대한 처리가 적절한지 검토해주세요.
        3. endpoint 또는 반복되는 요청 로직이 불필요하게 중복되지 않았는지 확인해주세요.
        4. 인증 정보나 민감한 값이 클라이언트 코드에 직접 노출되지 않는지 확인해주세요.
        5. API 레이어와 UI 레이어의 책임이 적절하게 분리되어 있는지 확인해주세요.

    - path: 'src/queries/**/*.{ts,tsx}'
      instructions: |
        1. queryKey가 데이터 범위와 파라미터를 안정적으로 표현하는지 확인해주세요.
        2. query와 mutation의 역할이 적절하게 분리되어 있는지 확인해주세요.
        3. mutation 이후 invalidateQueries 또는 캐시 업데이트가 필요한 경우 누락되지 않았는지 확인해주세요.
        4. 불필요한 refetch나 중복 요청이 발생할 가능성이 있는지 검토해주세요.
        5. 서버 상태를 불필요하게 별도의 로컬 state로 복제하고 있지 않은지 확인해주세요.

  # 자동 리뷰 트리거 설정
  auto_review:
    # PR 생성 시 CodeRabbit의 자동 리뷰 여부를 설정합니다.
    # true: PR 생성 시 자동으로 리뷰를 시작합니다.
    # false: 자동 리뷰를 진행하지 않으며, `@coderabbitai review` 코멘트로 수동 요청할 수 있습니다.
    enabled: true

    # 이미 리뷰가 진행된 PR에 새로운 커밋이 추가될 때, 변경된 부분에 대해서만 자동으로 리뷰를 진행할지 여부입니다.
    auto_incremental_review: true

# ---------------------------------------------------------------- #
# 채팅 기능 설정
# ---------------------------------------------------------------- #
chat:
  # 사용자가 @coderabbitai 태그를 지정하지 않아도 자동으로 답글을 달 수 있도록 설정합니다.
  auto_reply: true

# ---------------------------------------------------------------- #
# CodeRabbit의 지식 기반(Knowledge Base) 설정
# ---------------------------------------------------------------- #
knowledge_base:
  # 웹 검색을 통해 최신 정보나 문서를 참조할 수 있도록 허용할지 여부입니다.
  web_search:
    enabled: true

  # 레포지토리 내의 특정 파일을 AI의 코드 스타일 가이드라인으로 사용하도록 설정합니다.
  code_guidelines:
    enabled: true
    filePatterns:
      - docs/code-convention.md

  # CodeRabbit이 대화나 리뷰를 통해 학습한 내용을 어디에 저장하고 참조할지 범위를 설정합니다. 'local'은 현재 레포지토리에 한정됨을 의미합니다.
  learnings:
    scope: local
  # 이슈 정보를 참조할 범위를 설정합니다.
  issues:
    scope: local
  # 풀 리퀘스트 정보를 참조할 범위를 설정합니다.
  pull_requests:
    scope: local
